<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eden Rose — Wedding Photographer</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ====== BLOC HAUT : 3 panneaux + textes ====== -->
  <header class="section hero">
    <div class="strip strip-top">
      <div class="panel p-left"   aria-hidden="true"></div>
      <div class="panel p-center" aria-hidden="true"></div>
      <div class="panel p-right"  aria-hidden="true"></div>
      <div class="overlay" aria-hidden="true"></div>

      <!-- Textes superposés -->
      <div class="txt t-left-top">ROMANTIC &<br> MOMENTS</div>
      <div class="txt t-right-top">WEDDING<br> PHOTOGRAPHY</div>

      <h1 class="brand">EDEN ROSE</h1>

      <div class="txt t-left-bottom">ENCHANTING FRAMES</div>
      <div class="divider" aria-hidden="true"></div>
      <div class="txt t-right-bottom">ENDLESS MEMORIES</div>

      <!-- Monogramme FR -->
      <div class="monogram" aria-hidden="true">
        <span class="f">F</span><span class="r">R</span>
      </div>
    </div>
  </header>

  <!-- ====== BLOC MILIEU : 1 panneau plein ====== -->
  <section class="section middle">
    <div class="single-frame" aria-label="Bloc milieu"></div>
  </section>

  <!-- ====== BLOC BAS : 3 panneaux ====== -->
  <section class="section bottom">
    <div class="strip strip-bottom">
      <div class="panel b-left"   aria-hidden="true"></div>
      <div class="panel b-center" aria-hidden="true"></div>
      <div class="panel b-right"  aria-hidden="true"></div>
      <div class="overlay" aria-hidden="true"></div>
    </div>
  </section>

</body>
</html>
