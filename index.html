<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eden Rose — Wedding Photographer</title>
  <link rel="stylesheet" href="style.css" />
  <!-- polices proches de la maquette -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ====== STRIP HAUT : 3 images en taille réelle ====== -->
  <header class="strip strip-top">
    <div class="images">
      <img src="Parti en haut à gauche.png" alt="haut gauche" />
      <img src="en haut millieu.png" alt="haut milieu" />
      <img src="en haut à droite.png" alt="haut droite" />
    </div>

    <!-- calque texte par-dessus, sans zoom -->
    <div class="overlay">
      <div class="txt t-left-top">ROMANTIC &<br> MOMENTS</div>
      <div class="txt t-right-top">WEDDING<br> PHOTOGRAPHY</div>

      <h1 class="brand">EDEN ROSE</h1>

      <div class="txt t-left-bottom">ENCHANTING FRAMES</div>
      <div class="divider" aria-hidden="true"></div>
      <div class="txt t-right-bottom">ENDLESS MEMORIES</div>

      <div class="monogram" aria-hidden="true">
        <span class="f">F</span><span class="r">R</span>
      </div>
    </div>
  </header>

  <!-- ====== BLOC MILIEU : 1 image taille réelle ====== -->
  <section class="mid">
    <img src="millieu.png" alt="milieu" />
  </section>

  <!-- ====== STRIP BAS : 3 images en taille réelle ====== -->
  <section class="strip strip-bottom">
    <div class="images">
      <img src="en bas à gauche.png" alt="bas gauche" />
      <img src="en bas millieu.png" alt="bas milieu" />
      <img src="en bas à droite.png" alt="bas droite" />
    </div>
  </section>

</body>
</html>
